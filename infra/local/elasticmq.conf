include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  probe-jobs-eu-west-1 {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "probe-jobs-eu-west-1-dlq"
      maxReceiveCount = 5
    }
  }
  probe-jobs-eu-west-1-dlq { }

  probe-jobs-us-east-1 {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "probe-jobs-us-east-1-dlq"
      maxReceiveCount = 5
    }
  }
  probe-jobs-us-east-1-dlq { }

  probe-results {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "probe-results-dlq"
      maxReceiveCount = 5
    }
  }
  probe-results-dlq { }
}

aws {
  region = us-east-1
  accountId = 000000000000
}
