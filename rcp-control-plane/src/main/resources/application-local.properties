spring.datasource.url=jdbc:postgresql://localhost:15432/rcp
spring.datasource.username=rcp
spring.datasource.password=rcp-local-only
spring.task.scheduling.pool.size=8

rcp.runtime.enabled=true
rcp.runtime.probe-result-queue-region=us-east-1
rcp.runtime.sqs-endpoint=http://localhost:9324
rcp.runtime.probe-job-queue-urls[eu-west-1]=http://localhost:9324/000000000000/probe-jobs-eu-west-1
rcp.runtime.probe-job-queue-urls[us-east-1]=http://localhost:9324/000000000000/probe-jobs-us-east-1
rcp.runtime.probe-result-queue-url=http://localhost:9324/000000000000/probe-results
rcp.runtime.result-wait-time-seconds=1
rcp.runtime.result-visibility-timeout-seconds=60

# These workers are co-located only for local development. AWS uses isolated regional Lambdas.
rcp.local-worker.enabled=true
rcp.local-worker.aws-region=us-east-1
rcp.local-worker.sqs-endpoint=http://localhost:9324
rcp.local-worker.job-queue-urls[eu-west-1]=http://localhost:9324/000000000000/probe-jobs-eu-west-1
rcp.local-worker.job-queue-urls[us-east-1]=http://localhost:9324/000000000000/probe-jobs-us-east-1
rcp.local-worker.result-queue-url=http://localhost:9324/000000000000/probe-results
rcp.local-worker.wait-time-seconds=0
rcp.local-worker.visibility-timeout-seconds=60

rcp.local-identity.secret=${RCP_LOCAL_JWT_SECRET}

# The Vite proxy forwards the browser Origin header on mutating requests.
# Keep local browser origins explicit so POST/PUT reach API validation.
rcp.identity.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}

# JSON logs preserve key-value fields and OpenTelemetry trace/span correlation.
logging.structured.format.console=ecs
logging.structured.ecs.service.environment=local
logging.structured.json.context.include=true
