spring.application.name=rcp-control-plane

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ALB uses the readiness group; keep other actuator endpoints authenticated.
management.endpoint.health.probes.enabled=true

# A passing SLO needs sufficient conclusive evidence among finalized executions.
rcp.availability.minimum-evidence-coverage-percent=95

# Bound registered targets per identity; includes paused monitors.
rcp.monitors.max-per-owner=25
# Deployment-wide guardrails. A public demo tightens these (for example 60 s, 5000 ms, 15 monitors in total);
# max-total=0 disables the global cap.
rcp.monitors.min-interval-seconds=30
rcp.monitors.max-timeout-ms=30000
rcp.monitors.max-total=0

# Runtime queue polling is opt-in. Local Compose and AWS supply the queue URLs.
rcp.runtime.enabled=false

# AWS supplies RCP_IDENTITY_ISSUER_URI and RCP_IDENTITY_CLIENT_ID from the
# Terraform identity outputs. The local profile replaces Cognito with a test key.

# Members of this Cognito group (the shared public demo account) can read everything but change nothing.
rcp.identity.read-only-group=demo

# "Try the live demo": set RCP_DEMO_USERNAME and RCP_DEMO_PASSWORD (a Cognito user in the read-only group, no MFA)
# to let anonymous visitors sign in as it. Without them the demo endpoint answers 404.
# RCP_DEMO_OWNER_SUBJECT (the demo user's Cognito sub) and RCP_DEMO_MONITORS ("Name|https://target, ...") seed the
# demo account on startup: any configured monitor it lacks (matched by name) is created; existing ones are left
# alone. RCP_DEMO_EXAMPLE_MONITOR_URL gives each new account one example monitor on its first visit
# (POST /api/onboarding); leave it unset to start new accounts empty.
