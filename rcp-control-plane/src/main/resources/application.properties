spring.application.name=rcp-control-plane

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# A passing SLO needs sufficient conclusive evidence among finalized executions.
rcp.availability.minimum-evidence-coverage-percent=95

# Runtime queue polling is opt-in. Local Compose and AWS supply the queue URLs.
rcp.runtime.enabled=false

# AWS supplies RCP_IDENTITY_ISSUER_URI and RCP_IDENTITY_CLIENT_ID from the
# Terraform identity outputs. The local profile replaces Cognito with a test key.
