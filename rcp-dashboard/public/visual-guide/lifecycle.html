 stroke-width="1.5" /></marker></defs><g class="boundary"><rect x="60" y="564" width="480" height="329" /><path class="boundary-rule" d="M 80 624.16 H 520" /><text x="82" y="595.96" class="zone-title">eu-west-1</text><text x="82" y="614.76" class="zone-subtitle">Ireland · one regional job</text></g><g class="boundary"><rect x="740" y="564" width="480" height="329" /><path class="boundary-rule" d="M 760 624.16 H 1200" /><text x="762" y="595.96" class="zone-title">us-east-1</text><text x="762" y="614.76" class="zone-subtitle">Virginia · one regional job</text></g><g class="notes"><text x="70" y="96.82" class="rail-heading">One execution</text><text x="70" y="116.56" class="rail-copy">Two jobs. Two independent probes.</text><text x="70" y="131.6" class="rail-copy">One final verdict.</text><text x="70" y="243.46" class="rail-heading">Durable before delivery</text><text x="70" y="263.2" class="rail-copy">The outbox bridges the database</text><text x="70" y="278.24" class="rail-copy">and the queues without relying</text><text x="70" y="293.28" class="rail-copy">on a single successful send.</text><text x="552" y="601.6" class="rail-heading">Parallel work</text><text x="570" y="621.34" class="rail-copy">Same execution</text><text x="582" y="636.38" class="rail-copy">Same target</text><text x="555" y="651.42" class="rail-copy">Independent evidence</text><text x="584" y="787.72" class="tiny">Public HTTPS</text><text x="70" y="979.48" class="rail-heading">Observations, not verdicts</text><text x="70" y="999.22" class="rail-copy">Arrival order can vary.</text><text x="70" y="1014.26" class="rail-copy">Ireland sends across Regions.</text><text x="70" y="1129.88" class="rail-heading">One fact per job</text><text x="70" y="1149.62" class="rail-copy">Message ID + job ID protect</text><text x="70" y="1164.66" class="rail-copy">against repeat deliveries.</text><text x="70" y="1284.04" class="rail-heading">Finalize on readiness</text><text x="70" y="1303.78" class="rail-copy">Deadline = database time</text><text x="70" y="1318.82" class="rail-copy">+ monitor timeout + 30s grace.</text><text x="70" y="1333.86" class="rail-copy">Missing results never mean down.</text><text x="70" y="1581.08" class="rail-heading">A verdict is not an incident</text><text x="70" y="1600.82" class="rail-copy">The next diagram explains</text><text x="70" y="1615.86" class="rail-copy">agreement and consecutive streaks.</text></g><g class="connection " data-edge="schedule" data-phase="schedule"><path class="route-halo" d="M 640 132.54 L 640 201.16" /><path class="route" d="M 640 132.54 L 640 201.16" marker-end="url(#arrow)" /><g class="edge-caption" transform="translate(640 172.02)"><rect x="-58.7" y="-13" width="117.4" height="20" /><text text-anchor="middle">Begin transaction</text></g></g><g class="connection " data-edge="commit" data-phase="schedule"><path class="route-halo" d="M 640 376 L 640 417.36" /><path class="route" d="M 640 376 L 640 417.36" marker-end="url(#arrow)" /><g class="edge-caption" transform="translate(640 401.38)"><rect x="-24.6" y="-13" width="49.2" height="20" /><text text-anchor="middle">Commit</text></g></g><g class="connection " data-edge="publish" data-phase="probe"><path class="route-halo" d="M 640 494.44 V 545.2" /><path class="route" d="M 640 494.44 V 545.2" /><path class="route-halo" d="M 640 545.2 L 280 545.2 L 280 652.36" /><path class="route" d="M 640 545.2 L 280 545.2 L 280 652.36" marker-end="url(#arrow)" /><path class="route-halo" d="M 640 545.2 L 1000 545.2 L 1000 652.36" /><path class="route" d="M 640 545.2 L 1000 545.2 L 1000 652.36" marker-end="url(#arrow)" /><circle cx="640" cy="545.2" r="3" class="split-dot" /><g class="edge-caption" transform="translate(640 520.76)"><rect x="-37" y="-13" width="74" height="20" /><text text-anchor="middle">Publish ×2</text></g></g><g class="connection secondary" data-edge="publish-failed" data-phase="exceptions"><path class="route-halo" d="M 840 458.72 L 944 458.72" /><path class="route" d="M hidden>Clear selection</button></div><h2 id="inspect-title"></h2><p id="inspect-text"></p></aside></main><script>const MAP_W=1280,MAP_H=1673.2,MAP_NODES=[{"id":"scheduler","x":440,"y":65,"w":400,"h":76,"title":"Claim a due monitor","sub":"Scheduler · database clock","icon":"spring","step":"01","phase":"schedule","detail":"DueMonitorScheduler locks due monitors in a batch using the database clock. Scheduling starts one execution, with one job for each of the two expected Regions."},{"id":"transaction","x":340,"y":220,"w":600,"h":180,"title":"Save the execution and its intent","sub":"One atomic PostgreSQL transaction","icon":"postgres","step":"02","phase":"schedule","detail":"The same transaction inserts the execution and deadline, creates two regional jobs and two outbox events, and advances next_check_at. The deadline is database now + the monitor timeout + 30 seconds of result grace. No SQS send occurs inside this transaction."},{"id":"publisher","x":440,"y":450,"w":400,"h":76,"title":"Publish the staged jobs","sub":"Outbox publisher · send, then mark published","icon":"spring","step":"03","phase":"schedule","detail":"A separate publisher claims ready outbox events under a lease. It sends each job to its regional SQS queue, then marks the event published. A send that succeeds before a crash or lost lease may be repeated; this is not exactly-once delivery."},{"id":"retry","x":950,"y":450,"w":280,"h":76,"title":"Retry the outbox intent","sub":"Backoff · bounded publication attempts","icon":"timer","phase":"exceptions","kind":"generic","detail":"Failures are recorded against the claimed event. The default publisher allows five attempts, with delayed retries and a 30-second lease. Exhaustion is an outbox state, distinct from an SQS DLQ. A successful send before failed bookkeeping can also produce another delivery."},{"id":"eu-jobs","x":100,"y":700,"w":360,"h":76,"title":"Regional jobs queue","sub":"Amazon SQS · eu-west-1","icon":"sqs","step":"04","phase":"probe","detail":"The Ireland queue carries this execution’s regional job. Its Lambda event source consumes the message. Repeated queue-processing failures can reach the regional jobs DLQ."},{"id":"us-jobs","x":820,"y":700,"w":360,"h":76,"title":"Regional jobs queue","sub":"Amazon SQS · us-east-1","icon":"sqs","step":"04","phase":"probe","detail":"The Virginia queue carries the other regional job for the same execution. Each Region has its own queue, Lambda and jobs DLQ."},{"id":"eu-lambda","x":100,"y":850,"w":360,"h":76,"title":"Probe from Ireland","sub":"AWS Lambda · Java 21 / ARM64","icon":"lambda","step":"05","phase":"probe","detail":"The Ireland Lambda probes the same target URL as Virginia and emits its regional observation. HTTP evidence, errors and bot-protection information travel in the result. Its result is sent across Regions to the central us-east-1 queue. Expired or unsafe jobs can emit a non-target observation without making the HTTP request."},{"id":"us-lambda","x":820,"y":850,"w":360,"h":76,"title":"Probe from Virginia","sub":"AWS Lambda · Java 21 / ARM64","icon":"lambda","step":"05","phase":"probe","detail":"The Virginia Lambda independently probes the target URL and emits its own observation. Neither worker decides the incident status; the control plane later evaluates the collected evidence. Expired or unsafe jobs can emit a non-target observation without making the HTTP request."},{"id":"target","x":550,"y":850,"w":180,"h":76,"title":"Same public URL","sub":"Including the drill","icon":"globe","kind":"generic","phase":"probe","detail":"Both probes test the same public URL. For the demo drill this is /drill/status.html through Caddy. These arrows show HTTP requests; regional observations are sent separately to SQS."},{"id":"results","x":440,"y":1010,"w":400,"h":76,"title":"Collect regional observations","sub":"One central SQS results queue · us-east-1","icon":"sqs","step":"06","phase":"collect","detail":"Both regional observations arrive in the same us-east-1 results queue. Ireland sends cross-region; Virginia sends within its Region. Receipt order is not guaranteed. Missing observations are handled by the execution deadline."},{"id":"ingestion","x":440,"y":1170,"w":400,"h":76,"title":"Validate and deduplicate","sub":"Commit facts first · acknowledge SQS after","icon":"postgres","step":"07","phase":"collect","detail":"The consumer decodes the result. A PostgreSQL transaction records the SQS message ID and the regional result. Consumer name + message ID prevents repeated-message work; the unique job ID prevents duplicate logical results. Only after ingestion returns does the consumer acknowledge SQS. Processing failures leave the message for retry or DLQ."},{"id":"duplicate","x":950,"y":1170,"w":280,"h":76,"title":"Keep one logical result","sub":"Repeated message or job ID → no new fact","icon":"postgres","phase":"exceptions","detail":"A duplicate SQS message or a second result with the same job ID adds no new regional fact. The consumer acknowledges a handled duplicate. An acknowledgement failure can cause redelivery, which the durable deduplication handles again."},{"id":"gate","x":440,"y":1330,"w":400,"h":86,"title":"Both results or deadline?","sub":"Execution finalizer · readiness gate","icon":"timer","kind":"generic","step":"08","phase":"decide","detail":"Before the deadline, an execution with missing regional facts remains pending. Once both expected facts exist, or the deadline has elapsed, the finalizer can evaluate it. Receipt completeness does not guarantee usable evidence: bot challenges or infrastructure failures still affect the verdict."},{"id":"pending","x":950,"y":1330,"w":280,"h":86,"title":"Keep the execution pending","sub":"Missing facts · deadline still in the future","icon":"timer","kind":"generic","phase":"exceptions","detail":"With fewer than two facts and before the deadline, no verdict is finalized. A later scheduled finalizer pass revisits readiness. This waiting state does not declare the target DOWN."},{"id":"verdict","x":440,"y":1495,"w":400,"h":76,"title":"Persist one final verdict","sub":"Up · Down · Disagreement · No data","icon":"spring","step":"09","phase":"decide","detail":"ExecutionVerdictPolicy produces one verdict. No facts at the deadline means NO_DATA; one of two facts means DISAGREEMENT. With two facts, the policy also checks target-evidence validity before comparing regional outcomes. Full verdict rules belong to the next diagram."},{"id":"incident","x":440,"y":1650,"w":400,"h":76,"title":"Evaluate the incident policy","sub":"Persist incident state and transition history","icon":"postgres","step":"10","phase":"decide","detail":"A separate incident processor applies finalized executions to monitor incident state. Initial policy uses two consecutive DOWN verdicts to open and two consecutive UP verdicts to resolve. DISAGREEMENT and NO_DATA reset both streaks without opening or closing an incident; stale evaluations are ignored."}],MAP_EDGES=[{"id":"schedule","from":"scheduler","to":"transaction","phase":"schedule","d":"M 640 141 V 220","label":"Begin transaction","lx":640,"ly":183},{"id":"commit","from":"transaction","to":"publisher","phase":"schedule","d":"M 640 400 V 450","label":"Commit","lx":640,"ly":427},{"id":"publish","from":"publisher","to":"eu-jobs","phase":"probe","d":"M 640 526 V 580","label":"Publish ×2","lx":640,"ly":554,"branches":["M 640 580 H 280 V 700","M 640 580 H 1000 V 700"],"targets":["eu-jobs","us-jobs"]},{"id":"publish-failed","from":"publisher","to":"retry","phase":"exceptions","d":"M 840 488 H 950","label":"Send fails","lx":895,"ly":488,"secondary":true},{"id":"retry","from":"retry","to":"publisher","phase":"exceptions","d":"M 1090 526 V 565 H 400 V 504 H 440","label":"Backoff · re-claim","lx":1000,"ly":565,"secondary":true},{"id":"eu-consume","from":"eu-jobs","to":"eu-lambda","phase":"probe","d":"M 280 776 V 850","label":"Consume","lx":280,"ly":814},{"id":"us-consume","from":"us-jobs","to":"us-lambda","phase":"probe","d":"M 1000 776 V 850","label":"Consume","lx":1000,"ly":814},{"id":"eu-http","from":"eu-lambda","to":"target","phase":"probe","d":"M 460 888 H 550","label":"HTTP","lx":505,"ly":888},{"id":"us-http","from":"us-lambda","to":"target","phase":"probe","d":"M 820 888 H 730","label":"HTTP","lx":775,"ly":888},{"id":"eu-results","from":"eu-lambda","to":"results","phase":"collect","d":"M 280 926 V 980 H 580 V 1010","label":"Cross-region results","lx":435,"ly":980},{"id":"us-results","from":"us-lambda","to":"results","phase":"collect","d":"M 1000 926 V 980 H 700 V 1010","label":"Regional results","lx":850,"ly":980},{"id":"poll","from":"results","to":"ingestion","phase":"collect","d":"M 640 1086 V 1170","label":"Poll + ingest","lx":640,"ly":1128},{"id":"duplicate","from":"ingestion","to":"duplicate","phase":"exceptions","d":"M 840 1208 H 950","label":"Duplicate","lx":895,"ly":1208,"secondary":true},{"id":"facts","from":"ingestion","to":"gate","phase":"decide","d":"M 640 1246 V 1330","label":"Stored facts","lx":640,"ly":1290},{"id":"wait","from":"gate","to":"pending","phase":"exceptions","d":"M 840 1373 H 950","label":"Not yet","lx":895,"ly":1373,"secondary":true},{"id":"revisit","from":"pending","to":"gate","phase":"exceptions","d":"M 1090 1416 V 1446 H 895 V 1397 H 840","label":"Later pass","lx":990,"ly":1446,"secondary":true},{"id":"ready","from":"gate","to":"verdict","phase":"decide","d":"M 640 1416 V 1495","label":"Ready","lx":640,"ly":1457},{"id":"apply","from":"verdict","to":"incident","phase":"decide","d":"M 640 1571 V 1650","label":"Later policy pass","lx":640,"ly":1610}];</script><script>(()=>{const $=s=>document.querySelector(s),viewport=$('.map-viewport'),map=$('.scaled-map'),svg=$('#architecture'),services=[...document.querySelectorAll('[data-node]')],connections=[...document.querySelectorAll('[data-edge]')],lenses=[...document.querySelectorAll('[data-filter]')];let filter='all',selected=null,scale=1,manualZoom=false;
const explanations={all:['One execution, from intent to incident state.','The solid path is the lifecycle. Two regional workers independently collect evidence for the same execution. Dashed side paths explain retries, duplicate deliveries and pending work. Select any stage for its implementation details.'],schedule:['Save intent before sending jobs.','One database transaction persists the execution, its deadline, regional jobs, outbox events and next check time. A separate publisher then sends to SQS. The outbox lets delivery be retried; it does not make sending exactly once.'],probe:['Two independent views of the same URL.','Each regional queue feeds its own Lambda. Ireland and Virginia probe the same URL, including the demo drill through Caddy. Workers emit observations; the control plane makes the eventual verdict.'],collect:['Repeated delivery does not add another fact.','Both workers use one us-east-1 results queue. PostgreSQL deduplicates by processed message ID and unique job ID, before the consumer acknowledges SQS. Retry and DLQ behavior belong to message processing, not target health.'],decide:['Wait for evidence, then apply policy.','The finalizer waits for both facts or the deadline. It persists a verdict, then a separate incident processing loop applies the policy. Incomplete evidence before the deadline stays pending. The next diagram explains the four verdicts and incident streaks.'],exceptions:['Delivery and waiting need their own paths.','Outbox failures use delayed retries with bounded attempts; send-before-bookkeeping can duplicate delivery. Ingestion keeps one logical result. Missing observations remain pending until completion or deadline. These branches do not declare the target DOWN.']};
function paint(){const attached=selected?MAP_EDGES.filter(e=>e.from===selected||e.to===selected||(e.targets||[]).includes(selected)):[];const activeEdges=new Set(attached.map(e=>e.id));const matching=selected?attached:MAP_EDGES.filter(e=>filter==='all'||e.phase===filter);const activeNodes=new Set([selected,...matching.flatMap(e=>[e.from,e.to,...(e.targets||[])])]);connections.forEach(g=>{const on=selected?activeEdges.has(g.dataset.edge):filter==='all'||g.dataset.phase===filter;g.classList.toggle('active',on&&(!!selected||filter!=='all'));g.classList.toggle('dim',!on)});services.forEach(g=>{const on=filter==='all'&&!selected||activeNodes.has(g.dataset.node);g.classList.toggle('active',on&&(!!selected||filter!=='all'));g.classList.toggle('dim',!on);g.setAttribute('aria-pressed',String(selected===g.dataset.node))});lenses.forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',String(b.dataset.filter===filter))});const node=MAP_NODES.find(n=>n.id===selected);$('#inspect-kicker').textContent=node?'Stage / '+(node.step||'Side path'):'Flow / '+filter;$('#inspect-title').textContent=node?node.title:explanations[filter][0];$('#inspect-text').textContent=node?node.detail:explanations[filter][1];$('#clear-selection').hidden=!selected;window.diagramState={filter,selected,scale,nodeCount:MAP_NODES.length,edgeCount:MAP_EDGES.length,activeEdges:matching.map(e=>e.id)};}

function fit(){manualZoom=false;zoom(Math.min(1,viewport.clientWidth/MAP_W))}
lenses.forEach(b=>b.onclick=()=>{filter=b.dataset.filter;selected=null;paint()});services.forEach(g=>{const select=()=>{selected=selected===g.dataset.node?null:g.dataset.node;paint()};g.addEventListener('click',select);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}})});$('#clear-selection').onclick=()=>{selected=null;paint()};$('#zoom-in').onclick=()=>{manualZoom=true;zoom(scale+.15)};$('#zoom-out').onclick=()=>{manualZoom=true;zoom(scale-.15)};$('#fit').onclick=fit;document.addEventListener('keydown',e=>{if(e.key==='Escape'){selected=null;paint()}});new ResizeObserver(()=>{if(!manualZoom)fit()}).observe(viewport);
$('#export').onclick=()=>{const copy=svg.cloneNode(true);copy.removeAttribute('style');copy.querySelectorAll('.dim,.active').forEach(g=>g.classList.remove('dim','active'));copy.querySelectorAll('[aria-pressed]').forEach(g=>g.setAttribute('aria-pressed','false'));const style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');copy.insertBefore(style,copy.firstChild);const blob=new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rcp-check-lifecycle.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};paint();fit();})();
