<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RCP · Deployment atlas</title><style>.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

,"sub":"Private dashboard files","icon":"s3","flows":["web"],"detail":"The dashboard origin is private. CloudFront uses origin access control to retrieve the files."},{"id":"cognito","x":515,"y":390,"w":240,"h":76,"title":"Cognito","sub":"Sign-in + token issuer","icon":"cognito","flows":["auth"],"detail":"Cognito issues sign-in tokens. The control plane fetches signing keys and signs in the shared demo user for Try the demo."},{"id":"adapter","x":515,"y":520,"w":240,"h":76,"title":"OIDC adapter","sub":"Lambda function URL","icon":"lambda","flows":["auth"],"detail":"Node.js 22 Lambda translates GitHub OAuth into an OIDC provider for Cognito. GitHub itself is not OIDC."},{"id":"eu-jobs","x":120,"y":735,"w":240,"h":76,"title":"SQS / jobs","sub":"Ireland regional queue","icon":"sqs","flows":["checks"],"detail":"The control plane publishes one regional probe job into this queue. The regional Lambda consumes it. A separate jobs DLQ retains repeatedly failing messages."},{"id":"eu-lambda","x":120,"y":875,"w":240,"h":76,"title":"Probe Lambda","sub":"Java 21 · ARM64 · 256 MB","icon":"lambda","flows":["checks"],"detail":"The Ireland probe tests public targets, including the demo drill via Caddy. Its observations cross Regions into the central results queue in us-east-1."},{"id":"us-jobs","x":515,"y":735,"w":240,"h":76,"title":"SQS / jobs","sub":"Virginia regional queue","icon":"sqs","flows":["checks"],"detail":"The US jobs queue feeds the Virginia probe Lambda and has its own jobs DLQ."},{"id":"us-lambda","x":515,"y":875,"w":240,"h":76,"title":"Probe Lambda","sub":"Java 21 · ARM64 · 256 MB","icon":"lambda","flows":["checks"],"detail":"The Virginia probe tests the same public targets as the Ireland probe and sends observations to the central results queue in this Region."},{"id":"results","x":515,"y":1010,"w":240,"h":76,"title":"SQS / results","sub":"Central queue · us-east-1","icon":"sqs","flows":["checks"],"detail":"One central results queue receives both Regions. The control plane polls and ingests observations, then finalizes verdicts and applies incident policy. It has a separate results DLQ."},{"id":"caddy","x":970,"y":350,"w":340,"h":76,"title":"Caddy","sub":"Public HTTPS · ports 80 / 443","icon":"caddy-mark","flows":["web","checks","monitor"],"detail":"Caddy is the VM’s only public application entry point. It forwards API requests to Spring Boot, serves /drill/status.html from the sidecar, exposes coarse /healthz, and rejects public Actuator paths."},{"id":"control","x":970,"y":465,"w":340,"h":76,"title":"Spring Boot","sub":"Scheduler · outbox · verdicts · incidents","icon":"spring","flows":["web","auth","checks","monitor"],"detail":"Runs on the Oracle VM. It persists execution state in PostgreSQL, publishes jobs to both Regions, ingests the central results queue, verifies Cognito tokens and applies verdict and incident policy."},{"id":"postgres","x":1010,"y":600,"w":240,"h":76,"title":"PostgreSQL","sub":"17.6 · internal network","icon":"postgres","flows":["web","checks"],"detail":"PostgreSQL runs in a Docker container on the same VM, on an internal database network. This demo does not use RDS. Backup, restore-check and off-host export tooling are in the repository."},{"id":"drill","x":1010,"y":730,"w":240,"h":76,"title":"Drill sidecar","sub":"Controlled faulty responses","icon":"timer","kind":"generic","flows":["checks"],"detail":"A Python sidecar serves the controlled faulty responses. A host systemd timer chooses the drill schedule. Both regional Lambdas probe its public URL through Caddy."},{"id":"alloy","x":970,"y":870,"w":340,"h":76,"title":"Grafana Alloy","sub":"Monitoring profile · host + app metrics","icon":"alloy","flows":["monitor"],"detail":"The optional Compose monitoring profile scrapes host metrics and the private control-plane Prometheus endpoint, then sends them to Grafana Cloud."},{"id":"grafana-service","x":970,"y":1120,"w":340,"h":76,"title":"Metrics + synthetics","sub":"Dashboards · alerts → email","icon":"grafana","flows":["monitor"],"detail":"Grafana Cloud receives Alloy metrics and can check dashboard HTTPS and API /healthz. Local Terraform state records the two synthetic checks enabled; live health was not checked for this diagram."},{"id":"websites","x":65,"y":1295,"w":340,"h":76,"title":"Public targets","sub":"Same websites · both Regions","icon":"globe","kind":"generic","flows":["checks"],"detail":"Targets include ordinary public websites and the demo /drill/status.html endpoint on the Oracle VM. Target outcomes, missing observations and incident thresholds belong to the behavior diagrams."}],MAP_EDGES=[{"id":"delivery","from":"browser","to":"cloudfront","flow":"web","d":"M 260 116 V 170 H 400 V 340 H 240 V 390","label":"Dashboard HTTPS","lx":330,"ly":170,"vertical":false},{"id":"origin","from":"cloudfront","to":"s3","flow":"web","d":"M 240 466 V 520","label":"OAC","lx":240,"ly":493},{"id":"signin","from":"browser","to":"cognito","flow":"auth","d":"M 400 116 V 190 H 635 V 390","label":"Sign-in","lx":565,"ly":190},{"id":"api","from":"browser","to":"caddy","flow":"web","d":"M 450 116 V 210 H 935 V 388 H 970","label":"API HTTPS","lx":880,"ly":210},{"id":"google-federation","from":"google","to":"cognito","flow":"auth","d":"M 840 116 V 155 H 700 V 390","label":"Federation","lx":770,"ly":155},{"id":"github-oauth","from":"github","to":"adapter","flow":"auth","d":"M 1180 116 V 175 H 825 V 558 H 755","label":"GitHub OAuth","lx":1080,"ly":175},{"id":"adapter-oidc","from":"adapter","to":"cognito","flow":"auth","d":"M 515 558 H 495 V 442 H 515","label":"OIDC","lx":495,"ly":503,"vertical":true},{"id":"backend-auth","from":"control","to":"cognito","flow":"auth","d":"M 970 482 H 925 V 620 H 475 V 412 H 515","label":"Signing keys + demo sign-in","lx":665,"ly":620},{"id":"caddy-control","from":"caddy","to":"control","flow":"web","d":"M 1140 426 V 465","label":"API","lx":1168,"ly":447,"leader":"M 1140 447 H 1151"},{"id":"database","from":"control","to":"postgres","flow":"checks","d":"M 1130 541 V 600","label":"SQL","lx":1130,"ly":569},{"id":"drill-route","from":"caddy","to":"drill","flow":"checks","d":"M 1310 388 H 1320 V 701 H 1130 V 730","label":"/drill/status.html","lx":1150,"ly":701},{"id":"publish-jobs","from":"control","to":"eu-jobs","flow":"checks","d":"M 970 505 H 900 V 650 H 435 V 690","label":"Publish jobs","lx":665,"ly":650,"targets":["eu-jobs","us-jobs"],"branches":["M 435 690 V 711 H 240 V 735","M 435 690 H 635 V 735"]},{"id":"consume-eu","from":"eu-jobs","to":"eu-lambda","flow":"checks","d":"M 240 811 V 875","label":"Consume","lx":240,"ly":844},{"id":"consume-us","from":"us-jobs","to":"us-lambda","flow":"checks","d":"M 635 811 V 875","label":"Consume","lx":635,"ly":844},{"id":"results-eu","from":"eu-lambda","to":"results","flow":"checks","d":"M 360 913 H 435 V 1048 H 515","label":"Cross-region","lx":435,"ly":980,"vertical":true},{"id":"results-us","from":"us-lambda","to":"results","flow":"checks","d":"M 635 951 V 1010","label":"Observations","lx":635,"ly":980},{"id":"ingest","from":"results","to":"control","flow":"checks","d":"M 755 1048 H 910 V 526 H 970","label":"Poll + ingest","lx":910,"ly":980,"both":true,"vertical":true},{"id":"probe-eu","from":"eu-lambda","to":"websites","flow":"checks","d":"M 200 951 V 1070 H 45 V 1333 H 65","label":"HTTPS probe","lx":122,"ly":1070,"vertical":false},{"id":"probe-us","from":"us-lambda","to":"websites","flow":"checks","d":"M 755 913 H 825 V 1348 H 405","label":"HTTPS probe","lx":735,"ly":1348,"vertical":false},{"id":"metrics-scrape","from":"control","to":"alloy","flow":"monitor","d":"M 1310 512 H 1358 V 908 H 1310","label":"Private metrics","lx":1358,"ly":720,"secondary":true,"vertical":true},{"id":"metrics-send","from":"alloy","to":"grafana-service","flow":"monitor","d":"M 1140 946 V 995 H 1295 V 1090 H 1140 V 1120","label":"Host + app metrics","lx":1180,"ly":995},{"id":"synthetic-api","from":"grafana-service","to":"caddy","flow":"monitor","d":"M 1310 1158 H 1400 V 370 H 1310","label":"/healthz HTTPS","lx":1400,"ly":1040,"secondary":true,"vertical":true},{"id":"synthetic-dashboard","from":"grafana-service","to":"cloudfront","flow":"monitor","d":"M 970 1176 H 920 V 1190 H 15 V 428 H 120","label":"Dashboard HTTPS","lx":295,"ly":1190,"secondary":true}];</script><script>(()=>{const $=s=>document.querySelector(s),viewport=$('.map-viewport'),map=$('.scaled-map'),svg=$('#architecture'),services=[...document.querySelectorAll('[data-node]')],connections=[...document.querySelectorAll('[data-edge]')],lenses=[...document.querySelectorAll('[data-filter]')];let filter='all',selected=null,scale=1,manualZoom=false;const explanations={all:['A small host. A distributed check network.','AWS boundaries identify where each service runs. The Oracle VM owns scheduling, persistence, verdicts and incidents. Probe outcomes are explained in the next diagram.'],web:['The browser has two destinations.','CloudFront delivers the dashboard from private S3. Browser API requests travel separately to Caddy on the Oracle VM, then Spring Boot. Sign-in is a separate flow.'],auth:['Cognito owns identity.','Google federates directly. GitHub OAuth is translated to OIDC by the Lambda adapter. Spring Boot retrieves Cognito signing keys and signs in the shared demo user.'],checks:['Two regional workers. One central inbox.','The control plane publishes jobs to Ireland and Virginia. Both Lambdas probe the same websites, including the drill through Caddy. Results converge in us-east-1; the backend polls and ingests them.'],monitor:['Monitoring stays independent.','Alloy exports host and private application metrics to Grafana Cloud. External synthetic checks target dashboard HTTPS and API /healthz. Local state records both checks enabled; current live health is not asserted.']};
function paint(){const attached=selected?MAP_EDGES.filter(e=>e.from===selected||e.to===selected||(e.targets||[]).includes(selected)):[];const activeEdges=new Set(attached.map(e=>e.id)),activeNodes=new Set([selected,...attached.flatMap(e=>[e.from,e.to,...(e.targets||[])])]);connections.forEach(g=>{const on=selected?activeEdges.has(g.dataset.edge):filter==='all'||g.dataset.flow===filter;g.classList.toggle('active',on&&(!!selected||filter!=='all'));g.classList.toggle('dim',!on)});services.forEach(g=>{const on=selected?activeNodes.has(g.dataset.node):filter==='all'||g.dataset.flows.split(' ').includes(filter);g.classList.toggle('active',on&&(!!selected||filter!=='all'));g.classList.toggle('dim',!on);g.setAttribute('aria-pressed',String(selected===g.dataset.node))});lenses.forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',String(b.dataset.filter===filter))});const node=MAP_NODES.find(n=>n.id===selected);$('#inspect-kicker').textContent=node?'SERVICE / '+node.id.toUpperCase():'FLOW / '+filter.toUpperCase();$('#inspect-title').textContent=node?node.title:explanations[filter][0];$('#inspect-text').textContent=node?node.detail:explanations[filter][1];$('#clear-selection').hidden=!selected;window.diagramState={filter,selected,scale,nodeCount:MAP_NODES.length,edgeCount:MAP_EDGES.length,activeEdges:selected?[...activeEdges]:MAP_EDGES.filter(e=>filter==='all'||e.flow===filter).map(e=>e.id)};}
