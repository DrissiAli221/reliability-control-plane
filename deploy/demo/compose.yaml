name: rcp-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: rcp
      POSTGRES_USER: rcp
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcp -d rcp"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    logging: *logging

  control-plane:
    image: ${RCP_CONTROL_PLANE_IMAGE:-rcp-control-plane:demo}
    build:
      context: ../..
      dockerfile: rcp-control-plane/Dockerfile
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/bash", "/opt/demo/entrypoint.sh"]
    environment:
      SPRING_PROFILES_ACTIVE: aws
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rcp
      SPRING_DATASOURCE_USERNAME: rcp
      AWS_REGION: us-east-1
      AWS_PROFILE: rcp-demo
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/aws_credentials
      AWS_EC2_METADATA_DISABLED: "true"
      MANAGEMENT_SERVER_PORT: "9091"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: never
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=25 -Djava.io.tmpdir=/tmp"
    secrets:
      - postgres_password
      - aws_credentials
      - source: application_json
        target: application.json
      - demo_username
      - demo_password
      - demo_owner_subject
    volumes:
      - ./scripts/entrypoint.sh:/opt/demo/entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9091;
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    stop_grace_period: 30s
    mem_limit: 1024m
    cpus: 1.0
    logging: *logging

  alloy:
    image: grafana/alloy:v1.20.1
    profiles: [monitoring]
    restart: unless-stopped
    user: "473:473"
    init: true
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - --disable-reporting
    environment:
      GRAFANA_METRICS_URL: ${GRAFANA_METRICS_URL:-}
      GRAFANA_METRICS_USERNAME: ${GRAFANA_METRICS_USERNAME:-}
      GOMEMLIMIT: 192MiB
    secrets:
      - grafana_metrics_token
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - alloy_data:/var/lib/alloy/data
    networks:
      - edge
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5
    logging: *logging

  drill:
    image: python:3.13.7-alpine
    restart: unless-stopped
    user: "65534:65534"
    init: true
    command: ["python3", "-B", "/opt/drill/drill-server.py"]
    volumes:
      - ./scripts:/opt/drill:ro
      - ./drill:/srv/drill:ro
    networks: [drill]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2).close()"]
      interval: 20s
      timeout: 3s
      retries: 3
    logging: *logging

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      RCP_API_DOMAIN: ${RCP_API_DOMAIN:?Set RCP_API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      control-plane:
        condition: service_healthy
      drill:
        condition: service_started
    networks:
      - edge
      - drill
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  aws_credentials:
    file: ./secrets/aws_credentials
  application_json:
    file: ./secrets/application.json
  demo_username:
    file: ./secrets/demo_username
  demo_password:
    file: ./secrets/demo_password
  demo_owner_subject:
    file: ./secrets/demo_owner_subject
  grafana_metrics_token:
    file: ./secrets/grafana_metrics_token

networks:
  drill:
    internal: true
  database:
    internal: true
  edge:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  alloy_data:
