openapi: 3.0.3
info:
  title: RCP local reference API
  version: 1.0.0-reference
  description: |
    Contract for the implemented local reference endpoints, not an AWS deployment
    or a promise of production compatibility. Bearer tokens identify an operator;
    monitor and report resources are owner-scoped. The /local endpoints exist only
    under the Spring `local` profile. Actuator's operational endpoints are excluded.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/monitors:
    get:
      operationId: listMonitors
      summary: List the authenticated owner's monitors with current operational state
      responses:
        '200':
          description: Owner-scoped monitor overview
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonitorOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createMonitor
      summary: Register a safe HTTP(S) target
      description: |
        Target policy rejects credentials, query strings, fragments, non-default
        ports, private/special-purpose destinations, and unsafe DNS answers.
        The owner is limited to 25 registered monitors by default, including paused ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMonitorRequest'
      responses:
        '201':
          description: Monitor created; Location points to its owner-scoped GET resource
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          description: >-
            Invalid request, unsafe target, or outside this deployment's limits
            (`rcp.monitors.min-interval-seconds`, `rcp.monitors.max-timeout-ms`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Per-owner quota or the deployment-wide monitor cap (`rcp.monitors.max-total`) reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/monitors/{monitorId}:
    patch:
      operationId: setAcceptedHttpStatuses
      summary: Change the accepted HTTP statuses for future checks only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptedHttpStatuses]
              properties:
                acceptedHttpStatuses:
                  $ref: '#/components/schemas/AcceptedHttpStatuses'
      responses:
        '200':
          description: Updated monitor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: Read-only demo role cannot change statuses
    delete:
      summary: Delete an owned monitor
      description: Soft deletion stops scheduling, frees quota, removes public-page memberships and discards late results. Retained evidence is hidden; this is not a data-erasure endpoint.
      parameters:
        - $ref: '#/components/parameters/MonitorId'
      responses:
        '204':
          description: Monitor deleted
        '404':
          description: Monitor missing, deleted or owned by someone else
        '403':
          description: Read-only demo role cannot delete monitors
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      operationId: getMonitor
      summary: Read one owned monitor
      responses:
        '200':
          description: Monitor configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/monitors/{monitorId}/enabled:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    patch:
      operationId: setMonitorEnabled
      summary: Pause or resume an owned monitor without deleting history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Updated monitor configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/monitors/{monitorId}/history:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - name: days
        in: query
        required: false
        description: UTC days to include, ending today by PostgreSQL time.
        schema:
          type: integer
          minimum: 1
          maximum: 90
          default: 45
    get:
      operationId: getMonitorHistory
      summary: Daily verdict counts, per-region latency, and recent checks for an owned monitor
      responses:
        '200':
          description: Zero-filled daily evidence with regional detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/monitors/{monitorId}/latency-heatmap:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
    get:
      operationId: getLatencyHeatmap
      summary: HTTP-response latency counts per region, time column (48 per window) and latency band
      responses:
        '200':
          description: Zero-filled counts; band i covers [bound i-1, bound i) ms, the last band is open-ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatencyHeatmap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/monitors/{monitorId}/incident-state:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      operationId: getIncidentState
      summary: Position in the incident state machine, the thresholds that move it, and the latest evaluations
      responses:
        '200':
          description: Persisted streak counters; a never-evaluated monitor reports the healthy initial state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/monitors/{monitorId}/executions/{executionId}/trace:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - name: executionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getExecutionTrace
      summary: Every recorded timestamp of one check, from due time to incident evaluation
      description: >-
        Worker start and completion times come from the worker's clock; all other times are PostgreSQL time.
        An execution that belongs to another monitor returns 404 even when the caller owns this monitor.
      responses:
        '200':
          description: Execution, per-region job, outbox, result, and evaluation timestamps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionTrace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/pipeline:
    get:
      operationId: getPipelineSnapshot
      summary: Current work at each pipeline stage for the caller's monitors
      description: Counts are owner-scoped so one tenant cannot observe another tenant's volume. Throughput covers the last 300 seconds.
      responses:
        '200':
          description: Stage counts, per-region throughput, and the latest finalized checks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/demo/session:
    post:
      operationId: createDemoSession
      summary: Sign in as the shared read-only demo account ("Try the live demo")
      description: >-
        Anonymous. On AWS the server signs in as the configured demo user with Cognito AdminInitiateAuth
        (`rcp.demo.username`, `rcp.demo.password`), so the password never reaches the browser; locally it issues a
        development token for `rcp.demo.owner-subject` in the read-only group. No refresh token is returned.
        Limited to 30 sessions per minute across the deployment.
      security: []
      responses:
        '200':
          description: Tokens for the demo account
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  idToken: { type: string, nullable: true, description: Null in the local profile }
                  expiresInSeconds: { type: integer }
        '404':
          description: This deployment does not offer a demo account
        '429':
          description: Too many demo sign-ins in the current minute
  /api/onboarding:
    post:
      operationId: onboard
      summary: Give a brand-new account one example monitor, at most once
      description: >-
        Creates a monitor named "Example" for `rcp.demo.example-monitor-url` the first time an identity calls it,
        if it owns no monitors yet. Every later call, or any call when the URL is unset, is a no-op.
        Refused (403) for the read-only demo account.
      responses:
        '201':
          description: Example monitor created
        '204':
          description: Nothing to do
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Read-only account
  /api/me:
    get:
      operationId: getSession
      summary: The caller's session as this deployment sees it
      description: >-
        Whether the caller is in the read-only group (`rcp.identity.read-only-group`, the public demo account),
        and the monitor limits this deployment enforces, so clients offer only choices that will be accepted.
        Members of the read-only group receive 403 "Read-only account" on every POST, PUT, PATCH or DELETE under /api.
      responses:
        '200':
          description: Session and limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  readOnly: { type: boolean }
                  limits:
                    type: object
                    properties:
                      maxPerOwner: { type: integer }
                      maxTotal: { type: integer, description: 0 means no deployment-wide cap }
                      minIntervalSeconds: { type: integer }
                      maxTimeoutMs: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/overview:
    get:
      operationId: getFleetOverview
      summary: The caller's fleet at a glance for the console home page
      description: >-
        Finalized verdicts of all owned monitors in 48 half-hour buckets (oldest first, zero-filled, the newest still
        filling), plus every owned incident that was open at some point in the last 7 days (at most 50, newest first).
      responses:
        '200':
          description: Fleet verdict buckets and incident spans
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  bucketSeconds: { type: integer, example: 1800 }
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        up: { type: integer }
                        down: { type: integer }
                        disagreement: { type: integer }
                        noData: { type: integer }
                  incidentsFrom: { type: string, format: date-time }
                  incidents:
                    type: array
                    items:
                      type: object
                      properties:
                        incidentId: { type: string, format: uuid }
                        monitorId: { type: string, format: uuid }
                        monitorName: { type: string }
                        openedAt: { type: string, format: date-time }
                        resolvedAt: { type: string, format: date-time, nullable: true, description: Null while open }
        '401':
          description: Missing or invalid bearer token
  /api/pipeline/events:
    get:
      operationId: getPipelineEvents
      summary: The latest 40 steps of the caller's checks from the last 15 minutes, newest first
      description: Outbox publishes, ingested results, verdicts, and incident openings or resolutions, owner-scoped.
      responses:
        '200':
          description: Time-ordered events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    at:
                      type: string
                      format: date-time
                    type:
                      type: string
                      enum: [OutboxPublished, ResultIngested, ExecutionFinalized, IncidentOpened, IncidentResolved]
                    monitorId:
                      type: string
                      format: uuid
                    monitorName:
                      type: string
                    executionId:
                      type: string
                      format: uuid
                    region:
                      type: string
                      nullable: true
                    outcome:
                      type: string
                      nullable: true
                    httpStatus:
                      type: integer
                      nullable: true
                    latencyMs:
                      type: integer
                      nullable: true
                    detail:
                      type: string
                      nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/monitors/{monitorId}/availability:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/SloTarget'
    get:
      operationId: getAvailability
      summary: Calculate measured availability and evidence coverage
      responses:
        '200':
          description: Reference measurement, not a contractual SLO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/monitors/{monitorId}/reliability-report:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/SloTarget'
    get:
      operationId: getReliabilityReport
      summary: Generate an owner-only JSON reliability report
      responses:
        '200':
          description: Versioned report with source watermark and limitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReliabilityReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/monitors/{monitorId}/reliability-report/html:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/SloTarget'
    get:
      operationId: downloadReliabilityReportHtml
      summary: Download the same report model rendered as restrictive HTML
      responses:
        '200':
          description: HTML attachment; Content-Security-Policy is sandboxed
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/status-pages:
    post:
      operationId: createStatusPage
      summary: Publish a status page for monitors owned by the authenticated subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStatusPageRequest'
      responses:
        '201':
          description: Created status page
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /status/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPublicStatusPage
      summary: Read an explicitly published status page without a token
      security: []
      responses:
        '200':
          description: Public status projection; response is no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatusPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /local/token:
    post:
      operationId: issueLocalToken
      summary: Issue a development JWT (local profile only)
      x-local-only: true
      security: []
      parameters:
        - name: subject
          in: query
          required: false
          schema:
            type: string
            default: local-user
            maxLength: 120
      responses:
        '200':
          description: One-hour local test token
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresInSeconds]
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    example: Bearer
                  expiresInSeconds:
                    type: integer
                    format: int64
                    example: 3600
  /api/local/probe-fault:
    get:
      operationId: getLocalProbeFault
      summary: Read local fault-injection mode
      x-local-only: true
      responses:
        '200':
          description: Current mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalFaultMode'
    put:
      operationId: setLocalProbeFault
      summary: Change local simulated probe behavior
      x-local-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalFaultMode'
      responses:
        '200':
          description: New mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalFaultMode'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MonitorId:
      name: monitorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    From:
      name: from
      in: query
      required: true
      description: UTC inclusive start instant
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      description: UTC exclusive end instant
      schema:
        type: string
        format: date-time
    SloTarget:
      name: sloTargetPercent
      in: query
      required: false
      schema:
        type: number
        default: 99.9
  responses:
    BadRequest:
      description: Invalid request or unsafe target
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid bearer token
    NotFound:
      description: Missing resource, including a resource owned by another subject
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Monitor quota or status-page slug conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    AcceptedHttpStatuses:
      type: array
      nullable: true
      description: Null or omitted on create means 200–399. An explicit set replaces the default; each execution snapshots its rule. Duplicate entries are normalized and sorted. Null on PATCH restores the default; omitting the PATCH field is invalid.
      minItems: 1
      maxItems: 500
      items:
        type: integer
        minimum: 100
        maximum: 599
    CreateMonitorRequest:
      type: object
      required: [name, targetUrl, checkIntervalSeconds, timeoutMs]
      properties:
        acceptedHttpStatuses:
          $ref: '#/components/schemas/AcceptedHttpStatuses'
        name:
          type: string
          minLength: 1
          maxLength: 120
        targetUrl:
          type: string
          format: uri
          maxLength: 2048
          description: SafeTargetPolicy applies stricter rules than URI syntax alone.
        checkIntervalSeconds:
          type: integer
          minimum: 30
          maximum: 86400
        timeoutMs:
          type: integer
          minimum: 100
          maximum: 30000
    Monitor:
      type: object
      required: [id, name, targetUrl, checkIntervalSeconds, timeoutMs, enabled, nextCheckAt, createdAt]
      properties:
        acceptedHttpStatuses:
          $ref: '#/components/schemas/AcceptedHttpStatuses'
        id:
          type: string
          format: uuid
        name:
          type: string
        targetUrl:
          type: string
          format: uri
        checkIntervalSeconds:
          type: integer
        timeoutMs:
          type: integer
        enabled:
          type: boolean
        nextCheckAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    MonitorOverview:
      type: object
      required: [id, name, targetUrl, enabled, nextCheckAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        targetUrl:
          type: string
          format: uri
        enabled:
          type: boolean
        nextCheckAt:
          type: string
          format: date-time
        incidentStatus:
          type: string
          nullable: true
        latestVerdict:
          type: string
          nullable: true
        latestCheckedAt:
          type: string
          format: date-time
          nullable: true
    Availability:
      type: object
      required: [monitorId, from, to, sloTargetPercent, evidenceCoveragePercent, minimumEvidenceCoveragePercent, upExecutions, downExecutions, disagreementExecutions, noDataExecutions, conclusiveExecutions, totalFinalizedExecutions, pendingExecutions, missingExecutions, expectedOpportunities, denominatorPolicy]
      properties:
        monitorId:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        sloTargetPercent:
          type: number
        measuredAvailabilityPercent:
          type: number
          nullable: true
        evidenceCoveragePercent:
          type: number
        minimumEvidenceCoveragePercent:
          type: number
        sloMet:
          type: boolean
          nullable: true
          description: Null when evidence is insufficient to decide.
        upExecutions:
          type: integer
          format: int64
        downExecutions:
          type: integer
          format: int64
        disagreementExecutions:
          type: integer
          format: int64
        noDataExecutions:
          type: integer
          format: int64
        conclusiveExecutions:
          type: integer
          format: int64
        totalFinalizedExecutions:
          type: integer
          format: int64
        pendingExecutions:
          type: integer
          format: int64
        missingExecutions:
          type: integer
          format: int64
        expectedOpportunities:
          type: integer
          format: int64
        denominatorPolicy:
          type: string
    ReliabilityReport:
      type: object
      required: [schemaVersion, generatedAt, monitorName, targetUrl, availability, errorBudget, latency, incidentTimeline, incidentTimelineTruncated, limitations]
      properties:
        schemaVersion:
          type: string
          example: rcp-report-v1
        generatedAt:
          type: string
          format: date-time
        sourceDataWatermark:
          type: string
          format: date-time
          nullable: true
        monitorName:
          type: string
        targetUrl:
          type: string
          format: uri
        availability:
          $ref: '#/components/schemas/Availability'
        errorBudget:
          type: object
          properties:
            allowedBadExecutions:
              type: number
            observedBadExecutions:
              type: integer
              format: int64
            remainingExecutions:
              type: number
        latency:
          type: object
          properties:
            sampleCount:
              type: integer
              format: int64
            p50Ms:
              type: integer
              format: int64
              nullable: true
            p95Ms:
              type: integer
              format: int64
              nullable: true
            minimumSamples:
              type: integer
        incidentTimeline:
          type: array
          items:
            type: object
            properties:
              incidentId:
                type: string
                format: uuid
              eventType:
                type: string
              occurredAt:
                type: string
                format: date-time
        incidentTimelineTruncated:
          type: boolean
        limitations:
          type: array
          items:
            type: string
        caveats:
          type: array
          description: The same limits as `limitations`, grouped by topic.
          items:
            type: object
            required: [topic, text]
            properties:
              topic:
                type: string
                example: Coverage
              text:
                type: string
    CreateStatusPageRequest:
      type: object
      required: [name, slug, monitorIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          maxLength: 80
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        monitorIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        published:
          type: boolean
    StatusPage:
      type: object
      required: [id, name, slug, published, monitorIds]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        published:
          type: boolean
        monitorIds:
          type: array
          items:
            type: string
            format: uuid
    PublicStatusPage:
      type: object
      required: [name, slug, overallStatus, generatedAt, components]
      properties:
        name:
          type: string
        slug:
          type: string
        overallStatus:
          type: string
          example: OPERATIONAL
        generatedAt:
          type: string
          format: date-time
        components:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              latestVerdict:
                type: string
                nullable: true
              latestCheckedAt:
                type: string
                format: date-time
                nullable: true
              measuredUptimePercent:
                type: number
                nullable: true
                description: UP share of conclusive verdicts across the history window; null without conclusive evidence.
              history:
                type: array
                description: The last 45 UTC days, oldest first. Monitor identifiers and target URLs are never exposed.
                items:
                  $ref: '#/components/schemas/DailyEvidence'
    DailyEvidence:
      type: object
      required: [day, up, down, disagreement, noData, status]
      properties:
        day:
          type: string
          format: date
        up:
          type: integer
        down:
          type: integer
        disagreement:
          type: integer
        noData:
          type: integer
        status:
          type: string
          enum: [OPERATIONAL, DEGRADED, OUTAGE, NO_DATA]
          description: OUTAGE if any confirmed DOWN; DEGRADED if regions disagreed; NO_DATA verdicts alone never count as failure.
    MonitorHistory:
      type: object
      required: [monitorId, generatedAt, days, regions, recentChecks]
      properties:
        monitorId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        days:
          type: array
          items:
            $ref: '#/components/schemas/DailyEvidence'
        regions:
          type: array
          description: Per region, the last 24 hours. Percentiles use HTTP responses only.
          items:
            type: object
            properties:
              region:
                type: string
              httpSamples:
                type: integer
              p50Ms:
                type: integer
                nullable: true
              p95Ms:
                type: integer
                nullable: true
              lastOutcome:
                type: string
              lastAcceptedHttpStatuses:
                $ref: '#/components/schemas/AcceptedHttpStatuses'
              lastHttpStatus:
                type: integer
                nullable: true
              lastLatencyMs:
                type: integer
              lastCompletedAt:
                type: string
                format: date-time
        recentChecks:
          type: array
          description: The latest 30 finalized executions with their regional results.
          items:
            type: object
            properties:
              acceptedHttpStatuses:
                $ref: '#/components/schemas/AcceptedHttpStatuses'
              executionId:
                type: string
                format: uuid
              scheduledAt:
                type: string
                format: date-time
              verdict:
                type: string
              results:
                type: array
                items:
                  type: object
                  properties:
                    region:
                      type: string
                    outcome:
                      type: string
                    httpStatus:
                      type: integer
                      nullable: true
                    latencyMs:
                      type: integer
    LatencyHeatmap:
      type: object
      properties:
        monitorId:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        bucketSeconds:
          type: integer
        latencyBoundsMs:
          type: array
          items:
            type: integer
        regions:
          type: array
          items:
            type: object
            properties:
              region:
                type: string
              samples:
                type: integer
              counts:
                type: array
                description: One entry per time column, oldest first; each holds one count per latency band.
                items:
                  type: array
                  items:
                    type: integer
    IncidentState:
      type: object
      properties:
        status:
          type: string
          enum: [HEALTHY, OPEN]
        consecutiveDown:
          type: integer
        consecutiveUp:
          type: integer
        failuresToOpen:
          type: integer
        successesToResolve:
          type: integer
        openedAt:
          type: string
          format: date-time
          nullable: true
        lastEvaluatedAt:
          type: string
          format: date-time
          nullable: true
        recentEvaluations:
          type: array
          description: The latest 8 evaluations, newest first.
          items:
            type: object
            properties:
              executionId:
                type: string
                format: uuid
              scheduledAt:
                type: string
                format: date-time
              verdict:
                type: string
              transition:
                type: string
                enum: [NONE, OPENED, RESOLVED, IGNORED_STALE]
              evaluatedAt:
                type: string
                format: date-time
    ExecutionTrace:
      type: object
      properties:
        acceptedHttpStatuses:
          $ref: '#/components/schemas/AcceptedHttpStatuses'
        executionId:
          type: string
          format: uuid
        monitorId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        resultDeadlineAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, FINALIZED]
        verdict:
          type: string
          nullable: true
        finalizedAt:
          type: string
          format: date-time
          nullable: true
        expectedRegionCount:
          type: integer
        jobs:
          type: array
          items:
            type: object
            properties:
              jobId:
                type: string
                format: uuid
              region:
                type: string
              createdAt:
                type: string
                format: date-time
              publishedAt:
                type: string
                format: date-time
                nullable: true
              failedPublishAttempts:
                type: integer
                description: Publish attempts that failed; a first-try publish reports 0.
              publishFailedAt:
                type: string
                format: date-time
                nullable: true
              publishLastError:
                type: string
                nullable: true
              startedAt:
                type: string
                format: date-time
                nullable: true
              completedAt:
                type: string
                format: date-time
                nullable: true
              receivedAt:
                type: string
                format: date-time
                nullable: true
              outcome:
                type: string
                nullable: true
              httpStatus:
                type: integer
                nullable: true
              latencyMs:
                type: integer
                nullable: true
              responseBytes:
                type: integer
                nullable: true
              errorType:
                type: string
                nullable: true
        evaluation:
          type: object
          nullable: true
          properties:
            verdict:
              type: string
            transition:
              type: string
            evaluatedAt:
              type: string
              format: date-time
    PipelineSnapshot:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        windowSeconds:
          type: integer
        enabledMonitors:
          type: integer
        dueMonitors:
          type: integer
        pendingOutbox:
          type: integer
        failedOutbox:
          type: integer
        oldestPendingOutboxSeconds:
          type: integer
        pendingExecutions:
          type: integer
        awaitingIncidentEvaluation:
          type: integer
        openIncidents:
          type: integer
        regions:
          type: array
          items:
            type: object
            properties:
              region:
                type: string
              jobsPublished:
                type: integer
              resultsReceived:
                type: integer
              p50LatencyMs:
                type: integer
                nullable: true
        recentActivity:
          type: array
          description: The latest 15 finalized checks across the caller's monitors.
          items:
            type: object
            properties:
              monitorId:
                type: string
                format: uuid
              monitorName:
                type: string
              executionId:
                type: string
                format: uuid
              scheduledAt:
                type: string
                format: date-time
              verdict:
                type: string
              finalizedAt:
                type: string
                format: date-time
              transition:
                type: string
                nullable: true
    LocalFaultMode:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [PASS_THROUGH, HTTP_503, CONNECTION_FAILURE, REQUEST_TIMEOUT, RESPONSE_TOO_LARGE]
