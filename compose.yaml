services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: rcp
      POSTGRES_USER: rcp
      POSTGRES_PASSWORD: rcp-local-only
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcp -d rcp"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - rcp-postgres-data:/var/lib/postgresql/data

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./infra/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - rcp-prometheus-data:/prometheus

  tempo:
    image: grafana/tempo:2.8.2
    command:
      - -config.file=/etc/tempo.yml
    ports:
      - "3200:3200"
    volumes:
      - ./infra/local/tempo.yml:/etc/tempo.yml:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command:
      - --config=/etc/otelcol-contrib/config.yml
    depends_on:
      - tempo
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/local/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
      - tempo
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/local/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - rcp-grafana-data:/var/lib/grafana

volumes:
  rcp-postgres-data:
  rcp-prometheus-data:
  rcp-grafana-data:
